name: Folks
options:
  bundleIdPrefix: xyz.saltedchips
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Folks:
    type: application
    platform: iOS
    sources:
      - Folks
    dependencies:
      - target: FolksWidgets
    entitlements:
      path: Folks/Folks.entitlements
      properties:
        com.apple.security.application-groups: [group.xyz.saltedchips.folks]
    info:
      path: Folks/Info.plist
      properties:
        CFBundleDisplayName: Folks
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationQueriesSchemes: [sms, mailto, tel, whatsapp, tg, sgnl]
        CFBundleURLTypes:
          - CFBundleURLName: xyz.saltedchips.folks
            CFBundleURLSchemes: [folks]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.saltedchips.folks
        DEVELOPMENT_TEAM: YDBF8P8UF4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Folks
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FolksWidgets:
    type: app-extension
    platform: iOS
    sources:
      - FolksWidgets
      - Folks/Models
      - Folks/Shared
    info:
      path: FolksWidgets/Info.plist
      properties:
        CFBundleDisplayName: Folks
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FolksWidgets/FolksWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.xyz.saltedchips.folks]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.saltedchips.folks.widgets
        DEVELOPMENT_TEAM: YDBF8P8UF4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  FolksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FolksTests
    dependencies:
      - target: Folks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.saltedchips.folks.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Folks:
    build:
      targets:
        Folks: all
    test:
      targets:
        - FolksTests
