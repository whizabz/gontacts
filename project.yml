name: Gontacts
options:
  bundleIdPrefix: xyz.saltedchips
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Gontacts:
    type: application
    platform: iOS
    sources:
      - Gontacts
    dependencies:
      - target: GontactsWidgets
    entitlements:
      path: Gontacts/Gontacts.entitlements
      properties:
        com.apple.security.application-groups: [group.xyz.saltedchips.gontacts]
    info:
      path: Gontacts/Info.plist
      properties:
        CFBundleDisplayName: Gontacts
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationQueriesSchemes: [sms, mailto, tel, whatsapp, tg, sgnl]
        CFBundleURLTypes:
          - CFBundleURLName: xyz.saltedchips.gontacts
            CFBundleURLSchemes: [gontacts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.saltedchips.gontacts
        DEVELOPMENT_TEAM: YDBF8P8UF4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Gontacts
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GontactsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - GontactsWidgets
      - Gontacts/Models
      - Gontacts/Shared
    info:
      path: GontactsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Gontacts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GontactsWidgets/GontactsWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.xyz.saltedchips.gontacts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.saltedchips.gontacts.widgets
        DEVELOPMENT_TEAM: YDBF8P8UF4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  GontactsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GontactsTests
    dependencies:
      - target: Gontacts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.saltedchips.gontacts.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gontacts:
    build:
      targets:
        Gontacts: all
    test:
      targets:
        - GontactsTests
